# Yubikey Lifecycle Manager – Betrieb mit Docker Compose.
#
# Erstinstallation am einfachsten per Skript (legt .env mit Zufallsgeheimnissen an):
#   Linux/VPS:  curl -fsSL https://raw.githubusercontent.com/PanPakaPancake/Yubikey-Lifecycle-Manager/main/install.sh | sudo bash
#   Windows:    irm https://raw.githubusercontent.com/PanPakaPancake/Yubikey-Lifecycle-Manager/main/install.ps1 | iex
# Details: docs/BETRIEB.md
#
# Bitte diese Datei nicht verändern, sonst überschreibt bzw. blockiert sie spätere Updates.
# Eigene Einstellungen gehören in .env, eigene Ergänzungen in docker-compose.override.yml.
# Lokal aus dem Quellcode bauen (nur Entwicklung): siehe docker-compose.build.yml.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ylm
      POSTGRES_USER: ylm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ylm -d ylm"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    image: ghcr.io/panpakapancake/yubikey-lifecycle-manager:${YLM_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Postgres: Host=db;Database=ylm;Username=ylm;Password=${POSTGRES_PASSWORD}
      Ylm__PublicBaseUrl: ${YLM_PUBLIC_URL:-}
      Ylm__UpdaterUrl: http://updater:8090
      Ylm__UpdaterToken: ${UPDATER_TOKEN:-}
      # Optional: zusätzlich die Anmeldemethode der Admins prüfen (Standard aus, das regelt Entra per Bedingtem Zugriff).
      Ylm__RequirePhishingResistantSignIn: ${YLM_REQUIRE_PHISHING_RESISTANT:-false}
      # Bei eingeschalteter Prüfung akzeptierte Anmeldemethoden (amr im Microsoft-Token, Komma-Liste).
      Ylm__PhishingResistantAmrValues__0: ${YLM_ACCEPTED_AMR:-fido}
      Ylm__AutoRenewAppCertificate: ${YLM_CERT_AUTO_RENEW:-true}
      # Weitere vertrauenswürdige Reverse Proxys/ZTNA-Connectoren mit öffentlicher Adresse (Komma-Liste, Standard: private Netze).
      Ylm__TrustedProxies__0: ${YLM_TRUSTED_PROXIES:-}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      # App-Zertifikat (verschlüsselt) und Data-Protection-Schlüssel. Sichert der Dienst "backup" mit.
      - data:/data
    ports:
      # Standard: nur vom Rechner selbst erreichbar. HTTPS übernimmt Caddy (Profil "https") oder ein eigener Reverse Proxy.
      - "${YLM_BIND:-127.0.0.1:8080}:8080"

  # Update per Klick: holt auf Anforderung der Plattform das neue Server-Image und startet den Server neu.
  # Nur dieser Container sieht den Docker-Socket. Ohne UPDATER_TOKEN in .env nimmt er keine Aufträge an.
  updater:
    image: ghcr.io/panpakapancake/yubikey-lifecycle-manager-updater:latest
    restart: unless-stopped
    environment:
      UPDATER_TOKEN: ${UPDATER_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/project:ro

  # Datensicherung: täglich um BACKUP_TIME Datenbank und Volume "data" nach ./backups, alte Stände nach BACKUP_KEEP_DAYS weg.
  # Sofort sichern:  docker compose exec backup sh /backup.sh now
  # Wiederherstellen: docs/BETRIEB.md, Abschnitt "Datensicherung"
  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "/backup.sh"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Verschlüsselt die Sicherungen (dringend empfohlen). Passphrase zusätzlich im Passwortmanager ablegen.
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      BACKUP_TIME: ${BACKUP_TIME:-02:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
      - data:/data

  # HTTPS vor der Plattform: interne Zertifizierungsstelle, eigenes Zertifikat oder Let's Encrypt (YLM_CADDY_TLS).
  # Aktiv mit COMPOSE_PROFILES=https in .env (setzt das Installationsskript). Braucht YLM_DOMAIN und die Ports 80/443.
  caddy:
    image: caddy:2-alpine
    profiles: [https]
    restart: unless-stopped
    depends_on:
      - server
    environment:
      YLM_DOMAIN: ${YLM_DOMAIN:-}
      YLM_CADDY_TLS: ${YLM_CADDY_TLS:-}
    ports:
      - "${YLM_HTTPS_BIND:-0.0.0.0}:80:80"
      - "${YLM_HTTPS_BIND:-0.0.0.0}:443:443"
      - "${YLM_HTTPS_BIND:-0.0.0.0}:443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Eigenes Zertifikat (YLM_CADDY_TLS=tls /certs/ylm.crt /certs/ylm.key)
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db:
  data:
  caddy_data:
  caddy_config:
