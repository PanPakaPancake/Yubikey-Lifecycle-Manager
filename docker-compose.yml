# Selbst gehosteter Betrieb: PostgreSQL + Plattform.
# TLS übernimmt ein Reverse Proxy (z. B. Caddy, Traefik, nginx) vor Port 8080; siehe docs/BETRIEB.md.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ylm
      POSTGRES_USER: ylm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ylm -d ylm"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    # Fertiges Image aus den Releases; `docker compose up -d --build` baut stattdessen lokal aus dem Quellcode.
    image: ghcr.io/panpakapancake/yubikey-lifecycle-manager:${YLM_VERSION:-latest}
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Postgres: Host=db;Database=ylm;Username=ylm;Password=${POSTGRES_PASSWORD}
      Ylm__PublicBaseUrl: ${YLM_PUBLIC_URL:-}
      Ylm__UpdaterUrl: http://updater:8090
      Ylm__UpdaterToken: ${UPDATER_TOKEN:-}
      TZ: Europe/Berlin
    volumes:
      # Zertifikat (verschlüsselt), Data-Protection-Schlüssel – unbedingt sichern.
      - data:/data
    ports:
      - "127.0.0.1:8080:8080"

  # Update per Klick: holt auf Anforderung der Plattform das neue Server-Image und startet den Server neu.
  # Nur dieser Container sieht den Docker-Socket. Ohne UPDATER_TOKEN in .env nimmt er keine Aufträge an.
  updater:
    image: ghcr.io/panpakapancake/yubikey-lifecycle-manager-updater:latest
    build: ./updater
    restart: unless-stopped
    environment:
      UPDATER_TOKEN: ${UPDATER_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/project:ro

volumes:
  db:
  data:
