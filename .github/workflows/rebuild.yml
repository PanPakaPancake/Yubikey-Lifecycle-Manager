name: Sicherheits-Neubau

# Hält die veröffentlichten Images der aktuellen Version auf dem Stand der Basis-Images (Ubuntu/.NET, Alpine):
# täglich Schwachstellen-Scan (Trivy); bei behebbaren HIGH/CRITICAL-Funden und ohnehin einmal pro Woche
# werden Server- und Updater-Image der neuesten Version ohne Cache neu gebaut und unter demselben Tag
# veröffentlicht. Installationen holen sie mit den täglichen Sicherheitsupdates des Updaters (YLM_AUTO_REFRESH).
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Auch ohne Funde neu bauen
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: rebuild
  cancel-in-progress: false

env:
  TRIVY_IMAGE: aquasec/trivy:0.58.1

jobs:
  rebuild:
    name: Scan und Neubau
    runs-on: ubuntu-latest
    steps:
      - name: Neueste Version
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "server=ghcr.io/$OWNER/yubikey-lifecycle-manager" >> "$GITHUB_OUTPUT"
          echo "updater=ghcr.io/$OWNER/yubikey-lifecycle-manager-updater" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Schwachstellen in den veröffentlichten Images
        id: scan
        run: |
          need=0
          for img in "${{ steps.rel.outputs.server }}:${{ steps.rel.outputs.version }}" "${{ steps.rel.outputs.updater }}:${{ steps.rel.outputs.version }}"; do
            echo "### $img" >> "$GITHUB_STEP_SUMMARY"
            if ! docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image --quiet --scanners vuln \
                 --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 --format table "$img" > scan.txt 2>&1; then
              need=1
            fi
            { echo '```'; cat scan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "${{ github.event_name }}" = workflow_dispatch ] && [ "${{ inputs.force }}" = true ]; then need=1; fi
          if [ "$(date -u +%u)" = 1 ]; then need=1; fi   # montags immer
          echo "need=$need" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.scan.outputs.need == '1'
        with:
          ref: ${{ steps.rel.outputs.tag }}
      - name: Agent-MSI der Version holen
        if: steps.scan.outputs.need == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p agent-package
          gh release download "${{ steps.rel.outputs.tag }}" --repo "$GITHUB_REPOSITORY" -p '*.msi' -D agent-package
          echo "${{ steps.rel.outputs.version }}" > agent-package/version.txt
          ls -l agent-package
      - uses: docker/setup-qemu-action@v3
        if: steps.scan.outputs.need == '1'
      - uses: docker/setup-buildx-action@v3
        if: steps.scan.outputs.need == '1'
      - name: Server-Image neu bauen
        if: steps.scan.outputs.need == '1'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.rel.outputs.version }}
          pull: true
          no-cache: true
          tags: |
            ${{ steps.rel.outputs.server }}:${{ steps.rel.outputs.version }}
            ${{ steps.rel.outputs.server }}:latest
          push: true
      - name: Updater-Image neu bauen
        if: steps.scan.outputs.need == '1'
        uses: docker/build-push-action@v6
        with:
          context: ./updater
          platforms: linux/amd64,linux/arm64
          pull: true
          no-cache: true
          tags: |
            ${{ steps.rel.outputs.updater }}:${{ steps.rel.outputs.version }}
            ${{ steps.rel.outputs.updater }}:latest
          push: true
      - name: Ergebnis nach dem Neubau
        if: steps.scan.outputs.need == '1'
        run: |
          echo "## Nach dem Neubau" >> "$GITHUB_STEP_SUMMARY"
          for img in "${{ steps.rel.outputs.server }}:${{ steps.rel.outputs.version }}" "${{ steps.rel.outputs.updater }}:${{ steps.rel.outputs.version }}"; do
            docker run --rm "$TRIVY_IMAGE" image --quiet --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --format table "$img" > scan.txt 2>&1 || true
            { echo "### $img"; echo '```'; cat scan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
