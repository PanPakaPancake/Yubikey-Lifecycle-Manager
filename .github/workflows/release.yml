name: Release

# Neue Version veröffentlichen: Tag setzen, z. B. `git tag v0.2.0 && git push origin v0.2.0`.
# Baut das Agent-MSI, legt es ins Server-Image, veröffentlicht beide Images auf GHCR
# und erstellt ein GitHub-Release mit dem MSI. Die Updateprüfung der Plattform liest dieses Release.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

jobs:
  agent:
    name: Agent-MSI
    runs-on: windows-latest
    # Umgebung "release": Azure vertraut per Federated Credential genau diesem Job (Subject ...:environment:release).
    environment: release
    # Signierung mit Azure Artifact Signing (früher Trusted Signing), sobald die Variable SIGNING_ENDPOINT gesetzt ist.
    # Einrichtung: docs/SIGNIERUNG.md. Ohne die Variable entsteht wie bisher ein unsigniertes MSI.
    permissions:
      contents: read
      id-token: write
    env:
      SIGN: ${{ vars.SIGNING_ENDPOINT != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Programmdateien bauen
        shell: pwsh
        run: ./installer/build.ps1 -Version $env:GITHUB_REF_NAME.TrimStart('v') -Stage publish
      - name: Bei Azure anmelden (OIDC, ohne gespeichertes Passwort)
        if: env.SIGN == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Agent und Tray signieren
        if: env.SIGN == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\installer\publish
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: MSI bauen
        shell: pwsh
        run: ./installer/build.ps1 -Version $env:GITHUB_REF_NAME.TrimStart('v') -Stage package
      - name: MSI signieren
        if: env.SIGN == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\installer\out
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: Signaturen prüfen
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          $files = @(Get-ChildItem installer/publish -Recurse -Filter *.exe) + @(Get-ChildItem installer/out -Filter *.msi)
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature $f.FullName
            Write-Host "$($f.Name): $($s.Status) $($s.SignerCertificate.Subject)"
            if ($s.Status -ne 'Valid') { throw "$($f.Name) ist nicht gültig signiert." }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: agent-msi
          path: installer/out/*.msi

  images:
    name: Docker-Images und Release
    needs: agent
    runs-on: ubuntu-latest
    env:
      SERVER_IMAGE: ghcr.io/${{ github.repository_owner }}/yubikey-lifecycle-manager
      UPDATER_IMAGE: ghcr.io/${{ github.repository_owner }}/yubikey-lifecycle-manager-updater
      CADDY_IMAGE: ghcr.io/${{ github.repository_owner }}/yubikey-lifecycle-manager-caddy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: agent-msi
          path: agent-package
      - name: Version
        id: v
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "$VERSION" > agent-package/version.txt
          ls -l agent-package
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Images für linux/amd64 und linux/arm64 (z. B. ARM-VPS). Web und .NET baut der Runner nativ,
      # nur die End-Images laufen per QEMU für arm64.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Image-Namen
        id: names
        run: |
          echo "server=${SERVER_IMAGE,,}" >> "$GITHUB_OUTPUT"
          echo "updater=${UPDATER_IMAGE,,}" >> "$GITHUB_OUTPUT"
          echo "caddy=${CADDY_IMAGE,,}" >> "$GITHUB_OUTPUT"
      - name: Server-Image bauen und veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.v.outputs.version }}
          pull: true
          tags: |
            ${{ steps.names.outputs.server }}:${{ steps.v.outputs.version }}
            ${{ steps.names.outputs.server }}:latest
          push: true
      - name: Updater-Image bauen und veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: ./updater
          platforms: linux/amd64,linux/arm64
          pull: true
          tags: |
            ${{ steps.names.outputs.updater }}:${{ steps.v.outputs.version }}
            ${{ steps.names.outputs.updater }}:latest
          push: true
      - name: Caddy-Image bauen und veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: ./caddy
          platforms: linux/amd64,linux/arm64
          pull: true
          tags: |
            ${{ steps.names.outputs.caddy }}:${{ steps.v.outputs.version }}
            ${{ steps.names.outputs.caddy }}:latest
          push: true
      - name: GitHub-Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Beschreibung aus web/src/changelog.md (Abschnitt "## <Version> · <Datum>"); fehlt er, erzeugt GitHub die Notizen.
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '/^## /{ if (on) exit; split($2, a, " "); on = (a[1] == v) } on' web/src/changelog.md > notes.md
          if [ -s notes.md ]; then
            gh release create "$GITHUB_REF_NAME" agent-package/*.msi --title "$GITHUB_REF_NAME" --notes-file notes.md
          else
            echo "::warning::Kein Abschnitt für $v in web/src/changelog.md, GitHub erzeugt die Notizen."
            gh release create "$GITHUB_REF_NAME" agent-package/*.msi --title "$GITHUB_REF_NAME" --generate-notes
          fi
