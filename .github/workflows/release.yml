name: Release

# Neue Version veröffentlichen: Tag setzen, z. B. `git tag v0.2.0 && git push origin v0.2.0`.
# Baut das Agent-MSI, legt es ins Server-Image, veröffentlicht beide Images auf GHCR
# und erstellt ein GitHub-Release mit dem MSI. Die Updateprüfung der Plattform liest dieses Release.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

jobs:
  agent:
    name: Agent-MSI
    runs-on: windows-latest
    # Signierung über die SignPath Foundation (kostenlos für Open Source), sobald die Variable
    # SIGNPATH_ORGANIZATION_ID gesetzt ist. Einrichtung: docs/SIGNIERUNG.md. Ohne die Variable entsteht wie bisher
    # ein unsigniertes MSI. Jede Signierung muss in SignPath von Hand freigegeben werden (Vorgabe der Foundation),
    # der Lauf wartet darauf bis zu einer Stunde je Schritt.
    permissions:
      contents: read
      actions: read
    env:
      SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Programmdateien bauen
        shell: pwsh
        run: ./installer/build.ps1 -Version $env:VERSION.TrimStart('v') -Stage publish
      - name: Version für SignPath
        id: v
        shell: pwsh
        run: '"version=$($env:VERSION.TrimStart(''v''))" >> $env:GITHUB_OUTPUT'
      - name: Unsignierte Programmdateien hochladen
        if: env.SIGN == 'true'
        id: exe-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: agent-exe-unsigned
          path: installer/publish/
          if-no-files-found: error
      - name: Agent und Tray signieren (SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'Yubikey-Lifecycle-Manager' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: agent-exe
          github-artifact-id: ${{ steps.exe-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: installer/publish
          parameters: |
            version: ${{ toJSON(steps.v.outputs.version) }}
      - name: MSI bauen
        shell: pwsh
        run: ./installer/build.ps1 -Version $env:VERSION.TrimStart('v') -Stage package
      - name: Unsigniertes MSI hochladen
        if: env.SIGN == 'true'
        id: msi-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: agent-msi-unsigned
          path: installer/out/*.msi
          if-no-files-found: error
      - name: MSI signieren (SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'Yubikey-Lifecycle-Manager' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: agent-msi
          github-artifact-id: ${{ steps.msi-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: installer/out
      - name: Signaturen prüfen
        if: env.SIGN == 'true'
        shell: pwsh
        env:
          POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
        run: |
          $files = @(Get-ChildItem installer/publish -Recurse -Filter *.exe) + @(Get-ChildItem installer/out -Filter *.msi)
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature $f.FullName
            Write-Host "$($f.Name): $($s.Status) $($s.SignerCertificate.Subject)"
            if ($s.Status -eq 'Valid') { continue }
            # Testsignierung (selbstsigniertes Zertifikat von SignPath) ist nicht vertrauenswürdig, das ist dort erwartet.
            if ($env:POLICY -eq 'test-signing') { Write-Host "::warning::$($f.Name): Testsignatur ($($s.Status))." }
            else { throw "$($f.Name) ist nicht gültig signiert." }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: agent-msi
          path: installer/out/*.msi

  images:
    name: Docker-Images und Release
    needs: agent
    runs-on: ubuntu-latest
    env:
      SERVER_IMAGE: ghcr.io/${{ github.repository_owner }}/yubikey-lifecycle-manager
      UPDATER_IMAGE: ghcr.io/${{ github.repository_owner }}/yubikey-lifecycle-manager-updater
      CADDY_IMAGE: ghcr.io/${{ github.repository_owner }}/yubikey-lifecycle-manager-caddy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: agent-msi
          path: agent-package
      - name: Version
        id: v
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "$VERSION" > agent-package/version.txt
          ls -l agent-package
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Images für linux/amd64 und linux/arm64 (z. B. ARM-VPS). Web und .NET baut der Runner nativ,
      # nur die End-Images laufen per QEMU für arm64.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Image-Namen
        id: names
        run: |
          echo "server=${SERVER_IMAGE,,}" >> "$GITHUB_OUTPUT"
          echo "updater=${UPDATER_IMAGE,,}" >> "$GITHUB_OUTPUT"
          echo "caddy=${CADDY_IMAGE,,}" >> "$GITHUB_OUTPUT"
      - name: Server-Image bauen und veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.v.outputs.version }}
          pull: true
          tags: |
            ${{ steps.names.outputs.server }}:${{ steps.v.outputs.version }}
            ${{ steps.names.outputs.server }}:latest
          push: true
      - name: Updater-Image bauen und veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: ./updater
          platforms: linux/amd64,linux/arm64
          pull: true
          tags: |
            ${{ steps.names.outputs.updater }}:${{ steps.v.outputs.version }}
            ${{ steps.names.outputs.updater }}:latest
          push: true
      - name: Caddy-Image bauen und veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: ./caddy
          platforms: linux/amd64,linux/arm64
          pull: true
          tags: |
            ${{ steps.names.outputs.caddy }}:${{ steps.v.outputs.version }}
            ${{ steps.names.outputs.caddy }}:latest
          push: true
      - name: GitHub-Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Beschreibung aus web/src/changelog.md (Abschnitt "## <Version> · <Datum>"); fehlt er, erzeugt GitHub die Notizen.
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '/^## /{ if (on) exit; split($2, a, " "); on = (a[1] == v) } on' web/src/changelog.md > notes.md
          if [ -s notes.md ]; then
            gh release create "$GITHUB_REF_NAME" agent-package/*.msi --title "$GITHUB_REF_NAME" --notes-file notes.md
          else
            echo "::warning::Kein Abschnitt für $v in web/src/changelog.md, GitHub erzeugt die Notizen."
            gh release create "$GITHUB_REF_NAME" agent-package/*.msi --title "$GITHUB_REF_NAME" --generate-notes
          fi
