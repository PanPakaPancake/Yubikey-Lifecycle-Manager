name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Backend, Tests und Web
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ylm
          POSTGRES_PASSWORD: ylm
          POSTGRES_DB: ylm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ylm" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      YLM_TEST_POSTGRES: Host=localhost;Username=ylm;Password=ylm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web bauen (Typprüfung)
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: .NET bauen
        run: dotnet build YubikeyLifecycleManager.slnx -c Release
      - name: Tests
        run: dotnet test YubikeyLifecycleManager.slnx -c Release --no-build --logger "console;verbosity=normal"

  docker:
    name: Docker-Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image bauen
        run: docker build -t yubikey-lifecycle-manager:ci .

  agent:
    name: Agent, Tray-App und MSI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: MSI bauen
        shell: pwsh
        run: ./installer/build.ps1 -Version 0.1.${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: agent-msi
          path: installer/out/*.msi
