name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Backend, Tests und Web
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ylm
          POSTGRES_PASSWORD: ylm
          POSTGRES_DB: ylm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ylm" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      YLM_TEST_POSTGRES: Host=localhost;Username=ylm;Password=ylm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web bauen (Typprüfung)
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: .NET bauen
        run: dotnet build YubikeyLifecycleManager.slnx -c Release
      - name: Tests
        env:
          YLM_SAMPLE_DIR: ${{ github.workspace }}/muster
        run: dotnet test YubikeyLifecycleManager.slnx -c Release --no-build --logger "console;verbosity=normal"
      - name: Muster-PIN-Briefe hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muster-pin-briefe
          path: muster/*.pdf
          if-no-files-found: ignore
          retention-days: 14

  docker:
    name: Docker-Images und Installation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell-Skripte (shellcheck)
        run: shellcheck install.sh && shellcheck -s sh deploy/backup.sh
      - name: Compose-Datei (lokal und mit HTTPS-Profil)
        run: |
          cp .env.example .env
          docker compose config -q
          COMPOSE_PROFILES=https YLM_DOMAIN=ylm.example.com docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.build.yml config -q
      - name: Caddy-Image und Caddyfile
        run: |
          docker build --pull -t ylm-ci/caddy ./caddy
          for tls in "" "tls admin@example.com" "tls internal" "import dns-cloudflare" "import dns-hetzner" "import dns-ionos" \
                     "import dns-netcup" "import dns-azure" "import dns-route53" "import dns-digitalocean"; do
            echo "== YLM_CADDY_TLS=$tls"
            docker run --rm -e YLM_DOMAIN=ylm.example.com -e YLM_DOMAIN_ALIASES=alt.example.com -e YLM_CADDY_TLS="$tls" \
              -e YLM_ACME_EMAIL=admin@example.com -e YLM_DNS_TOKEN=abcdefghijklmnopqrstuvwxyz0123456789ABCD \
              -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" ylm-ci/caddy caddy validate --config /etc/caddy/Caddyfile
          done
      - name: Installation lokal (Skript, Sicherung, Wiederherstellung)
        run: |
          rm .env
          # Images aus diesem Stand bauen und per Override verwenden, damit der Test nicht von Releases abhängt.
          docker build --pull -t ylm-ci/server .
          docker build --pull -t ylm-ci/updater ./updater
          # Schwachstellen-Scan: behebbare CRITICAL-Funde lassen die CI scheitern, HIGH steht im Protokoll.
          for img in ylm-ci/server ylm-ci/updater ylm-ci/caddy; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 image --quiet --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL "$img"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 image --quiet --scanners vuln --ignore-unfixed --severity CRITICAL --exit-code 1 "$img"
          done
          mkdir -p "$RUNNER_TEMP/ylm" "$RUNNER_TEMP/raw"
          printf 'services:\n  server:\n    image: ylm-ci/server\n  updater:\n    image: ylm-ci/updater\n' > "$RUNNER_TEMP/ylm/docker-compose.override.yml"
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/raw/main"
          YLM_RAW_URL="file://$RUNNER_TEMP/raw" bash install.sh --dir "$RUNNER_TEMP/ylm" --mode local --version main --yes
          cd "$RUNNER_TEMP/ylm"
          docker compose exec -T backup sh /backup.sh now
          docker compose stop server
          docker compose exec -T backup sh /backup.sh restore "$(ls backups | head -n1)"
          docker compose start server
          docker compose ps

  installer-ps1:
    name: install.ps1 (Syntax)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parsen mit Windows PowerShell 5.1 und PowerShell 7
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }
          powershell -NoProfile -Command "`$e=`$null; [System.Management.Automation.Language.Parser]::ParseFile('$PWD\install.ps1',[ref]`$null,[ref]`$e) | Out-Null; if (`$e) { `$e; exit 1 }"

  agent:
    name: Agent, Tray-App und MSI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: MSI bauen
        shell: pwsh
        run: ./installer/build.ps1 -Version 0.1.${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: agent-msi
          path: installer/out/*.msi
      # Vorschaubilder der Tray-App (Einstellungen, Status, Koppeln, Menü; dunkel und hell) für Reviews.
      - name: Tray-Screenshots
        shell: pwsh
        run: |
          $p = Start-Process installer/publish/tray/YlmTray.exe -ArgumentList '--screenshots', "$PWD\tray-screenshots" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'Screenshots: Zeitüberschreitung' }
          Get-ChildItem tray-screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: tray-screenshots
          path: tray-screenshots/*.png

  # Ende-zu-Ende-Tests der Web-Oberfläche (Playwright, tests/e2e). Zuerst gegen den Testserver tests/Ylm.E2E.Host
  # (echter Server mit simuliertem Entra und simuliertem YubiKey-Agent): Anmeldung, lokaler Passkey, Agent koppeln,
  # Key registrieren mit PIN-Brief, Inventar, Rollout, alle Hauptseiten. Danach Rauchtest gegen den Docker-Stack
  # mit dem in diesem Lauf gebauten Image. Bericht mit Screenshots/Videos bei Fehlern als Artefakt "e2e-bericht".
  e2e-browser:
    name: "E2E: Browser-Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ylm
          POSTGRES_PASSWORD: ylm
          POSTGRES_DB: ylm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ylm" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      YLM_TEST_POSTGRES: Host=localhost;Username=ylm;Password=ylm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            tests/e2e/package-lock.json
      - name: Web und Testserver bauen
        run: |
          (cd web && npm ci && npm run build)
          dotnet build tests/Ylm.E2E.Host -c Release
      - name: Playwright installieren
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser-Tests gegen den Testserver
        working-directory: tests/e2e
        run: npx playwright test --project=host
      - name: Docker-Stack starten (Image aus diesem Stand)
        run: |
          mkdir -p agent-package
          docker build --pull -t ylm-ci/server .
          printf 'POSTGRES_PASSWORD=e2e-%s\nYLM_PUBLIC_URL=http://localhost:8080\n' "$RANDOM$RANDOM" > .env
          docker compose -f docker-compose.yml -f tests/e2e/docker-compose.e2e.yml up -d db server
          for i in $(seq 1 60); do curl -sf http://localhost:8080/healthz && break; sleep 2; done
          curl -sf http://localhost:8080/healthz
      - name: Rauchtest gegen den Docker-Stack
        working-directory: tests/e2e
        run: npx playwright test --project=docker
      - name: Server-Protokoll (Docker)
        if: failure()
        run: docker compose -f docker-compose.yml -f tests/e2e/docker-compose.e2e.yml logs server --tail 300
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-bericht
          path: tests/e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  # Rauchtest des Agents auf Windows (tests/agent-smoke): MSI aus dem Job "agent" installieren, Dienst und Tray-App
  # starten (darf nicht abstürzen), Dienst über die Named Pipe mit einem HTTPS-Testserver koppeln, deinstallieren.
  e2e-windows-agent:
    name: "E2E: Windows-Agent"
    needs: agent
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: agent-msi
          path: installer/out
      - name: Testserver bauen
        run: dotnet build tests/Ylm.E2E.Host -c Release
      - name: PostgreSQL starten (auf dem Runner vorinstalliert)
        shell: pwsh
        run: |
          $svc = Get-Service postgresql* | Select-Object -First 1
          Set-Service $svc.Name -StartupType Manual
          Start-Service $svc.Name
          (Get-Service $svc.Name).Status
      - name: Agent-Rauchtest
        shell: pwsh
        timeout-minutes: 15
        run: ./tests/agent-smoke/Test-AgentSmoke.ps1 -Msi (Get-ChildItem installer/out/*.msi | Select-Object -First 1).FullName
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-smoke-protokolle
          path: tests/agent-smoke/logs/
          if-no-files-found: ignore
          retention-days: 14
